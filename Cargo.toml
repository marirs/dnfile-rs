[package]
name = "dnfile"
version = "0.3.0"
description = ".NET binary extractor"
authors = ["Marirs <marirs@gmail.com>", "Andrey Mnatsakanov <andrey@3ig.kiev.ua>", "Jorge Alejandro Durán Royo<jorge.duran.royo@gmail.com>"]
keywords = ["dotnet", "binary", "extractor", "pe"]
categories = ["parsing"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/marirs/dnfile-rs"
homepage = "https://github.com/marirs/dnfile-rs"
edition = "2024"
rust-version = "1.85"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
walkdir = "2"
serde_json = "1"
goblin = { version = "0.10", features = ["alloc"] }
scroll = "0.13"
uuid = "1"
byteorder = "1"

# CLI-only dependencies. Pulled in only when the `cli` feature is enabled,
# so library consumers don't pay for them.
clap = { version = "4", features = ["derive"], optional = true }
prettytable-rs = { version = "0.10", optional = true }

[features]
default = []
# Enables the `dndump` binary (a Capa-style CLI inspector).
cli = ["dep:clap", "dep:prettytable-rs"]

[lib]
name = "dnfile"
path = "src/lib.rs"

[[bin]]
name = "dndump"
path = "src/bin/dndump.rs"
required-features = ["cli"]
